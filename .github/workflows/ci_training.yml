name: Machine Learning CI Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas numpy scikit-learn

    - name: Run MLflow Project (Re-training Model)
      run: |
        cd MLProject && mlflow run . --no-conda

    - name: Commit and Push Model Artifacts
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Robot"
        git add MLProject/mlruns/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Artefak model hasil re-training terbaru" && git push)

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and Push Docker Image using MLflow
      run: |
        LATEST_RUN=$(ls -t MLProject/mlruns/1/ | grep -v 'meta.yaml' | head -n 1)
        mlflow models build-docker -m "MLProject/mlruns/1/$LATEST_RUN/artifacts/model" -n "${{ secrets.DOCKER_HUB_USERNAME }}/mlflow-model:latest"
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mlflow-model:latest